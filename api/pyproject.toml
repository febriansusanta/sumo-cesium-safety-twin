[project]
name = "sumo-cesium-api"
version = "0.1.0"
description = "Local SUMO–Cesium traffic-safety digital twin API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "eclipse-sumo==1.27.1",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "libsumo==1.27.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pyproj==3.7.2",
  "pyyaml==6.0.3",
  "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
